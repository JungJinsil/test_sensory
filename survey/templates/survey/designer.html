<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>설문 디자이너</title>
</head>
<body>
  <h1>설문 디자이너 페이지</h1>

  <!-- 새 QuestionSet 생성 폼 -->
  <h2>새 설문(QuestionSet) 만들기</h2>
  <form method="POST" style="border:1px solid #ccc; padding: 10px;">
    {% csrf_token %}
    <p>
      <label>설문 이름:</label>
      <input type="text" name="name" placeholder="ex) 이점검사_2025_03" />
    </p>
    <p>
      <label>설명:</label>
      <textarea name="description" rows="3" cols="40" placeholder="간단 설명"></textarea>
    </p>
    <button type="submit">생성하기</button>
  </form>

  <!-- 기존 QuestionSet 목록 표시 -->
  <h2>기존 설문 목록</h2>
  <ul>
    {% for qs in question_sets %}
      <li>
        <b>{{ qs.name }}</b> - {{ qs.description }}
        <br/>
        - 생성일: {{ qs.created_at|date:"Y-m-d H:i" }}
        <br/>
        <!-- 각 QuestionSet에 질문 추가 링크 -->
        <a href="{% url 'add_question' qs.id %}">질문 추가</a>
        <!-- 
          나중에 설문 삭제, 수정, 상세보기 등을 구현할 수도 있음
        -->
        <hr/>
      </li>
    {% endfor %}
    {% if question_sets|length == 0 %}
      <li>아직 등록된 설문이 없습니다.</li>
    {% endif %}
  </ul>

</body>
</html>

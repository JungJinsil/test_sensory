<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>SweetOptima - 설문 만들기</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  />
  <style>
    body {
      background-color: #f2f2f2;
    }
    .title-logo {
      font-weight: bold;
      font-size: 1.4rem;
      color: #fff;
    }
    .main-card {
      background-color: #ffffff;
      border: none;
      border-radius: 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand title-logo">SweetOptima</span>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-8 col-lg-6">
        <div class="card main-card">
          <div class="card-body p-4">
            <h2 class="card-title mb-4">새 설문 만들기</h2>
            <form method="POST">
              {% csrf_token %}
              <div class="mb-3">
                <label class="form-label">설문 이름</label>
                <input type="text" name="name" class="form-control" placeholder="예) 이점검사_2025_04" />
              </div>
              <div class="mb-3">
                <label class="form-label">설문 유형</label>
                <select name="survey_type" class="form-select">
                  <option value="이점검사">이점검사</option>
                  <option value="소비자검사">소비자검사</option>
                  <option value="묘사분석">묘사분석</option>
                </select>
              </div>
              <button type="submit" class="btn btn-dark">생성하기</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

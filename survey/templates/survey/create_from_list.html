<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>복사&편집 - 설문목록</title>
  <!-- Bootstrap... -->
</head>
<body>
  <!-- 네비바... -->
  <div class="container mt-5">
    <h3>복사&편집할 설문 선택</h3>
    <ul class="list-group">
      {% for qs in surveys %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <div>
            <b>{{ qs.name }}</b> ({{ qs.survey_type }})
          </div>
          <button class="btn btn-dark btn-sm" onclick="location.href='/survey/create/copy/{{ qs.id }}/'">
            복사&편집
          </button>
        </li>
      {% empty %}
        <li class="list-group-item">아직 설문이 없습니다.</li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>

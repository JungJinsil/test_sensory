<!-- survey/templates/survey/create_tri_test.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>삼점검사 설문 만들기</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  />
  <style>
    body {
      background-color: #f2f2f2;
    }
    .title-logo {
      font-weight: bold;
      font-size: 1.4rem;
      color: #fff;
    }
    .main-card {
      background-color: #ffffff;
      border: none;
      border-radius: 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <!-- 상단 네비바 -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand title-logo">SweetOptima</span>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-sm-8 col-md-6 col-lg-5">
        <div class="card main-card p-4">
          <h3 class="mb-4 text-center">삼점검사 설문 만들기</h3>
          
          <!-- 폼 (POST) -->
          <form method="POST">
            {% csrf_token %}

            <!-- 설문 제목 -->
            <div class="mb-3">
              <label class="form-label">설문 제목</label>
              <!-- value="{{ default_title }}" 식으로 파이썬에서 넘긴 값 표시 -->
              <input
                type="text"
                name="title"
                class="form-control"
                value="{{ default_title }}"
              />
            </div>
            
            <!-- 서술형 설명문 -->
            <div class="mb-3">
              <label class="form-label">서술형 설명문</label>
              <textarea
                name="description"
                class="form-control"
                rows="3"
              >{{ default_description }}</textarea>
            </div>
            
            <!-- Set 수 입력 -->
            <div class="mb-3">
              <label class="form-label">Set 수</label>
              <input
                type="number"
                name="set_count"
                class="form-control"
                min="1"
                value="{{ default_set_count }}"
              />
              <small class="text-muted">
                삼점검사는 시료가 3개씩. 예) 2Set → 총 6샘플
              </small>
            </div>
            
            <button type="submit" class="btn btn-dark w-100">
              생성하기
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (선택사항) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

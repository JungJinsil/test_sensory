<!-- survey/templates/survey_done.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>설문 완료</title>
  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  />
  <style>
    body {
      background-color: #f2f2f2;
    }
    .title-logo {
      font-weight: bold;
      font-size: 1.4rem;
      color: #fff;
    }
    .main-card {
      background-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      border: none;
      border-radius: 5px;
      padding: 2rem;
    }
    .thank-title {
      font-size: 1.8rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- 상단 네비게이션 바 -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand title-logo">SweetOptima</span>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card main-card">
          <h2 class="thank-title text-center mb-3">설문에 참여해주셔서 감사합니다!</h2>
          <p class="text-center mb-4">
            응답이 정상적으로 제출되었습니다.
          </p>
          <div class="d-flex justify-content-center gap-3">
            <!-- "다시 평가하기" 버튼 →
                 /survey/diff/{{ set_id }}/ 로 이동 -->
            <button
              class="btn btn-primary"
              onclick="location.href='/survey/diff/{{ set_id }}/'"
            >
              다시 평가하기
            </button>

            <!-- "메인 화면" 버튼 →
                 http://127.0.0.1:8000/ 로 이동 -->
            <button
              class="btn btn-secondary"
              onclick="location.href='http://127.0.0.1:8000/'"
            >
              메인 화면
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (필요하다면) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

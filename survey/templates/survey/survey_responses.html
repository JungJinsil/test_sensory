<!-- survey/templates/survey/survey_responses.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>{{ question_set.name }} - 응답확인</title>
  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  />
  <style>
    body {
      background-color: #f2f2f2;
    }
    .title-logo {
      font-weight: bold;
      font-size: 1.4rem;
      color: #fff;
    }
    .main-card {
      background-color: #ffffff;
      border: none;
      border-radius: 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <!-- 네비바 -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand title-logo">SweetOptima</span>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="card main-card p-4">
      <h3 class="mb-3">{{ question_set.name }} - 응답확인</h3>
      <p class="mb-4 text-secondary">총 응답수: {{ table_rows|length }}</p>

      <!-- 테이블 -->
      <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
          <thead class="table-dark">
            <tr>
              <!-- 첫 열: 패널이름 -->
              <th scope="col">패널이름</th>
              <!-- 이후 열: 1Set, 2Set, 3Set, ... -->
              {% for i in range_list %}
                <th scope="col">{{ i }}Set</th>
              {% endfor %}
            </tr>
          </thead>
          <tbody>
            <!-- 각 응답에 대해 한 행씩 -->
            {% for row in table_rows %}
              <tr>
                <!-- row[0] = 패널이름 -->
                <td>{{ row.0 }}</td>
                <!-- row[1..] = 1Set, 2Set, ... 값 -->
                {% for val in row|slice:'1:' %}
                  <td>{{ val }}</td>
                {% endfor %}
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>

      <!-- CSV 다운로드 링크 -->
      <div class="mt-3">
        <a href="{% url 'download_csv' question_set.id %}" class="btn btn-sm btn-outline-primary">
          CSV 다운로드
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

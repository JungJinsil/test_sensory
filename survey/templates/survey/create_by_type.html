<!-- survey/templates/survey/create_by_type.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>{{ chosen_type }} 설문 만들기</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  />
  <style>
    body { background-color: #f2f2f2; }
    .title-logo {
      font-weight: bold;
      font-size: 1.4rem;
      color: #fff;
    }
    .main-card {
      background-color: #ffffff;
      border: none;
      border-radius: 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand title-logo">SweetOptima</span>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-sm-8 col-md-6 col-lg-5">
        <div class="card main-card p-4">
          <h3 class="text-center mb-3">{{ chosen_type }} 설문 만들기</h3>
          
          <form method="POST">
            {% csrf_token %}
            
            {% if chosen_type == "이점검사" %}
              <!-- 이점검사: 고급 폼 (title, description, set_count) -->
              <div class="mb-3">
                <label class="form-label">설문 제목</label>
                <input
                  type="text"
                  name="title"
                  class="form-control"
                  placeholder="250316) 알룰로스 테스트"
                />
              </div>
              <div class="mb-3">
                <label class="form-label">서술형 문구</label>
                <textarea
                  name="description"
                  class="form-control"
                  rows="3"
                  placeholder="예) 두 시료를 비교하여 단맛이 더 강한 시료를 선택하시오."
                ></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label">Set 수</label>
                <input
                  type="number"
                  name="set_count"
                  class="form-control"
                  min="1"
                  value="1"
                />
                <small class="text-muted">
                  Set당 시료 2개 (이점검사). ex) 2Set → 4샘플
                </small>
              </div>
            
            {% else %}
              <!-- 그 외 (소비자검사/묘사분석 등): 기존 폼 (이름만) -->
              <div class="mb-3">
                <label class="form-label">설문 이름</label>
                <input
                  type="text"
                  name="name"
                  class="form-control"
                  placeholder="{{ chosen_type }}_2025"
                />
              </div>
            {% endif %}
            
            <button type="submit" class="btn btn-dark w-100">
              생성
            </button>
          </form>
          
        </div>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>SweetOptima - 설문목록</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  />
  <style>
    body {
      background-color: #f2f2f2;
    }
    .title-logo {
      font-weight: bold;
      font-size: 1.4rem;
      color: #fff;
    }
    .main-card {
      background-color: #ffffff;
      border: none;
      border-radius: 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand title-logo">SweetOptima</span>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-sm-10 col-md-8 col-lg-6">
        <div class="card main-card">
          <div class="card-body p-4">
            <h2 class="card-title mb-4">설문 목록 확인</h2>
            
            <ul class="list-group">
              <!-- ▼▼ 여기서부터 반복문 ▼▼ -->
              {% for qs in surveys %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                  <div>
                    <b>{{ qs.name }}</b>
                    <br/>
                    <span class="text-muted">유형: {{ qs.survey_type }}</span>
                  </div>
                  <div>
                    <button class="btn btn-dark btn-sm" onclick="location.href='/survey/diff/{{ qs.id }}/'">평가</button>
                    <button class="btn btn-secondary btn-sm" onclick="location.href='/survey/responses/{{ qs.id }}/'">응답</button>
                    <button class="btn btn-secondary btn-sm" onclick="location.href='/survey/create/{{ qs.id }}/copy/'">복사</button>
                  </div>
                </li>
              {% empty %}
                <li class="list-group-item">아직 설문이 없습니다.</li>
              {% endfor %}
              <!-- ▲▲ 반복문 끝 ▲▲ -->
            </ul>

          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
